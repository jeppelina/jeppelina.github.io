  <text x="80" y="278" font-family="Fraunces, Georgia, serif" font-size="17" fill="#141414">A declining rate of ethnic endogamy</text>
  <text x="80" y="295" font-size="12" fill="#6E6E6E">share of Swedish-ancestry women partnering within their group</text>

