  <text x="80" y="464" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6E6E6E" letter-spacing="0.04em">SOURCE · STATISTICS SWEDEN REGISTERS · LINDMARKER</text>
</svg>
