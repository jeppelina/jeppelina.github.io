<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulations — Jesper Lindmarker</title>
    <meta name="description" content="Toy simulations exploring how patterns of partner choice — endogamy, segregation, hierarchy — emerge from underlying mechanisms.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>J</text></svg>">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;
            --color-bg: #FAFAF8;
            --color-text: #1a1a1a;
            --color-text-muted: #6b6b6b;
            --color-accent: #B44A2D;
            --color-accent-2: #3B6994;
            --color-border: #e8e6e1;
        }

        body {
            font-family: var(--font-sans);
            color: var(--color-text);
            background: var(--color-bg);
            line-height: 1.6;
            padding-top: 64px;
        }

        /* Site nav — mirrors the home page */
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(250, 250, 248, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav.scrolled { border-bottom-color: var(--color-border); }
        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }
        .nav-logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text);
            letter-spacing: -0.02em;
            text-decoration: none;
        }
        .nav-logo:hover { color: var(--color-accent); }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            color: var(--color-text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            position: relative;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--color-accent);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-links a:hover { color: var(--color-text); }
        .nav-links a:hover::after { width: 100%; }
        .nav-links a.active { color: var(--color-text); }
        .nav-links a.active::after { width: 100%; }
        .nav-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .nav-toggle span {
            width: 24px;
            height: 2px;
            background: var(--color-text);
            transition: 0.3s;
        }

        /* Page heading below the nav */
        .hub-title {
            max-width: 1100px;
            margin: 1.4rem auto 0.4rem auto;
            padding: 0 1.5rem;
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 400;
        }
        .hub-title em { color: var(--color-accent); font-style: italic; }

        .hub {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 1.6rem;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0;
            scrollbar-width: thin;
        }
        .tab {
            background: none;
            border: none;
            padding: 0.55rem 0 0.55rem 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            text-align: left;
            font-family: var(--font-sans);
            color: var(--color-text-muted);
            transition: color 0.15s ease, border-color 0.15s ease;
            white-space: nowrap;
            margin-bottom: -1px;
        }
        .tab:hover { color: var(--color-text); }
        .tab.active {
            color: var(--color-text);
            border-bottom-color: var(--color-accent);
        }
        .tab-label {
            font-family: var(--font-serif);
            font-size: 1.05rem;
            font-style: italic;
            display: block;
            line-height: 1.2;
        }
        .tab-sub {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--color-text-muted);
            display: block;
            margin-top: 2px;
        }

        /* Tab caption — short context above each loaded sim */
        .tab-caption {
            font-size: 0.78rem;
            color: var(--color-text-muted);
            padding: 0.6rem 0 0.4rem 0;
            font-style: italic;
        }
        .tab-caption strong { color: var(--color-text); font-style: normal; font-weight: 500; }

        /* Frame */
        .frame-wrap {
            position: relative;
            width: 100%;
        }
        iframe {
            display: block;
            width: 100%;
            min-height: 720px;
            border: none;
            background: var(--color-bg);
            transition: opacity 0.18s ease;
        }
        iframe.loading { opacity: 0.4; }

        @media (max-width: 720px) {
            .hub-title { padding: 0 1rem; font-size: 1.2rem; }
            .hub { padding: 1rem; }
            .tabs { gap: 1.1rem; }
            .tab-label { font-size: 0.95rem; }
        }
        @media (max-width: 768px) {
            .nav-toggle { display: flex; }
            .nav-links {
                position: fixed;
                top: 64px;
                left: 0; right: 0;
                background: rgba(250, 250, 248, 0.98);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 2rem;
                gap: 1rem;
                border-bottom: 1px solid var(--color-border);
                transform: translateY(-100%);
                opacity: 0;
                pointer-events: none;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .nav-links.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
</head>
<body>
    <nav class="nav" id="nav" aria-label="Main navigation">
        <div class="nav-inner">
            <a href="/" class="nav-logo">JL</a>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="/#research">Research</a></li>
                <li><a href="/simulation/" class="active">Simulations</a></li>
                <li><a href="/#papers">Papers</a></li>
                <li><a href="/#teaching">Teaching</a></li>
                <li><a href="/#history">History</a></li>
                <li><a href="/#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <h1 class="hub-title">Simulations <em>— how patterns emerge from partner choice</em></h1>

    <div class="hub">
        <nav class="tabs" id="tabs" role="tablist">
            <button class="tab active" data-sim="space-vs-preference" data-caption="<strong>Propinquity and endogamy.</strong> Two groups in a city. How much of observed sorting is driven by where people live versus whom they prefer?" role="tab" aria-selected="true">
                <span class="tab-label">Space or preference?</span>
                <span class="tab-sub">spatial mediation of endogamy</span>
            </button>
            <button class="tab" data-sim="structure-vs-behavior" data-caption="<strong>Decomposing change.</strong> Two snapshots — earlier (T1) and later (T2) — each with its own minority share (structure) and in-group preference (behaviour). The decomposition splits each group's endogamy change into composition versus preference; they can move in opposite directions and hit majority and minority differently." role="tab" aria-selected="false">
                <span class="tab-label">Structure or behaviour?</span>
                <span class="tab-sub">decomposing trends in endogamy</span>
            </button>
            <button class="tab" data-sim="status-vs-homophily" data-caption="<strong>Identification puzzle — directed preferences.</strong> Three groups, an editable directed acceptance matrix. Endogamy from in-group preference looks much like endogamy from exclusion above." role="tab" aria-selected="false">
                <span class="tab-label">Hierarchy or homophily?</span>
                <span class="tab-sub">directed preferences and exclusion</span>
            </button>
        </nav>

        <p class="tab-caption" id="tab-caption"></p>

        <div class="frame-wrap">
            <iframe id="frame" src="space-vs-preference/" title="Simulation" loading="eager"></iframe>
        </div>
    </div>

    <script>
    // --- Site nav: scroll-state class + mobile toggle ---
    const navEl = document.getElementById('nav');
    if (navEl) {
        window.addEventListener('scroll', () => {
            navEl.classList.toggle('scrolled', window.scrollY > 40);
        }, { passive: true });
    }
    const navToggle = document.getElementById('nav-toggle');
    const navLinksList = document.getElementById('nav-links');
    if (navToggle && navLinksList) {
        navToggle.addEventListener('click', () => {
            navLinksList.classList.toggle('open');
            const isOpen = navLinksList.classList.contains('open');
            navToggle.setAttribute('aria-expanded', isOpen);
        });
        navLinksList.querySelectorAll('a').forEach(a => {
            a.addEventListener('click', () => navLinksList.classList.remove('open'));
        });
    }

    const tabs = document.querySelectorAll('.tab');
    const frame = document.getElementById('frame');
    const captionEl = document.getElementById('tab-caption');

    function selectSim(sim, opts = {}) {
        const { push = true, force = false } = opts;
        const tab = [...tabs].find(t => t.dataset.sim === sim);
        if (!tab) return;

        tabs.forEach(t => {
            const on = t === tab;
            t.classList.toggle('active', on);
            t.setAttribute('aria-selected', on ? 'true' : 'false');
        });

        captionEl.innerHTML = tab.dataset.caption || '';

        if (force || frame.dataset.current !== sim) {
            frame.classList.add('loading');
            frame.src = sim + '/';
            frame.dataset.current = sim;
        }

        const title = tab.querySelector('.tab-label').textContent;
        document.title = title + ' — Simulations — Jesper Lindmarker';

        if (push && location.hash !== '#' + sim) {
            history.replaceState(null, '', '#' + sim);
        }
    }

    tabs.forEach(t => t.addEventListener('click', () => selectSim(t.dataset.sim)));

    function readHash() {
        const sim = location.hash.replace('#', '');
        if (sim && [...tabs].some(t => t.dataset.sim === sim)) {
            selectSim(sim, { push: false });
        } else {
            // Default — first tab. iframe src already matches via HTML default.
            const first = tabs[0]?.dataset.sim;
            if (first) {
                frame.dataset.current = first;
                captionEl.innerHTML = tabs[0].dataset.caption || '';
            }
        }
    }
    window.addEventListener('hashchange', readHash);
    readHash();

    // Auto-size iframe to its content (same-origin).
    function fit() {
        try {
            const doc = frame.contentDocument;
            if (!doc || !doc.body) return;
            const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
            if (h > 200) frame.style.height = (h + 24) + 'px';
        } catch (_) { /* cross-origin or not ready */ }
    }
    frame.addEventListener('load', () => {
        frame.classList.remove('loading');
        fit();
        try {
            const doc = frame.contentDocument;
            if (!doc) return;
            const ro = new ResizeObserver(fit);
            ro.observe(doc.body);
        } catch (_) { /* ignore */ }
        // Re-fit a few times to catch font swap, canvas init, slider rendering
        setTimeout(fit, 120);
        setTimeout(fit, 400);
        setTimeout(fit, 1200);
    });
    </script>
    <script data-goatcounter="https://jeppelina.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
