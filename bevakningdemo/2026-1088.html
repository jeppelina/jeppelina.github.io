const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw, silent){
  const err=document.getElementById('err'); if(err) err.textContent='';
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(P.salt),iterations:200000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
    const doc=new TextDecoder().decode(buf);
    sessionStorage.setItem('bd_pw',pw);
    document.open();document.write(doc);document.close();
  }catch(e){
    sessionStorage.removeItem('bd_pw');
    if(!silent && err) err.textContent='Fel lösenord.';
  }
}
function go(){const v=document.getElementById('pw').value; if(v) unlock(v,false);}
document.getElementById('go').onclick=go;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
const saved=sessionStorage.getItem('bd_pw');
if(saved) unlock(saved,true);
</script></body></html>
