    h+='<div class="line">'+lines[pos].map(p=>{
      const val=(p.actual>=0?'':'−')+Math.abs(p.actual)+'k';
      return `<div class="pl ${p.captain?'c':''}"><div class="nm">${p.name}${p.captain?'<span class="cb">C</span>':''}</div>`+
             `<div class="sub">${p.team}</div><div class="g" style="color:${gcol(p.actual)}">${val}</div>`+
             `<div class="pp">pred ${p.growth}k</div></div>`;}).join('')+'</div>';}
  h+='</div><div class="brk"><span>actual squad <b>'+t.act_squad+'k</b></span><span>captain © <b>+'+t.act_capbonus+'k</b></span>'+
     '<span class="tt">actual <b>'+t.actual+'k</b></span><span>predicted <b>'+t.total+'k</b></span></div>';
  return h;
}
function render(){
  const T = round===1 ? R1 : R2, a=ACC[round];
  document.getElementById('b1').className='rbtn'+(round===1?' on':'');
  document.getElementById('b2').className='rbtn'+(round===2?' on':'');
  document.getElementById('meta').innerHTML='<span class="live">FINAL · ROUND '+round+'</span><span>TEAMS <b>'+a.n+'</b></span><span>RANKED BY ACTUAL</span><span>MODEL <b>Large Lindmarker Model</b></span>';
  const banner = round===2
    ? 'Round 2: the model predicted the finishing order well — <span class="big">Spearman '+a.rho+'</span>, average miss <span class="big">'+a.mae+' places</span>. '+
      'A big jump from R1 (0.04): the improved model (median point, real odds, real-lineup start probs) met a less variance-dominated round. '+
      '<b>Large Lindmarker Model won the round (2232k)</b> and leads the league.'
    : 'Round 1: predicted order vs actual was near-random — <span class="big">Spearman '+a.rho+'</span>, average miss <span class="big">'+a.mae+' places</span>. '+
      'A single round\'s team total is dominated by which 2–3 players haul; one-round order is mostly variance. (R2 came in at 0.70.)';
  document.getElementById('note').innerHTML='<div class="acc">Ranked by <b>actual</b> value increase, with the model\'s <b>predicted</b> figure alongside. '+banner+'</div>';
  const maxV=Math.max(1,...T.map(t=>t.actual));
  document.getElementById('list').innerHTML=T.map(t=>`
   <div class="row" data-s="${t.slug}">
     <div class="head grid"><div class="rk ${t.act_rank<=3?'top':''}">${String(t.act_rank).padStart(2,'0')}</div>
       <div><div class="tn">${t.name}</div><div class="ow">${t.owner} · ${t.formation} · © ${t.captain||'?'} · pred #${t.pred_rank}</div></div>
       <div class="predcol">${t.total}k</div>
       <div class="act">${t.actual}k<div class="bar" style="width:${Math.max(8,t.actual/maxV*120)}px"></div></div></div>
     <div class="body">${pitch(t)}</div></div>`).join('');
  document.querySelectorAll('.row').forEach(r=>r.querySelector('.head').onclick=()=>r.classList.toggle('open'));
}
function setRound(r){round=r;render();}
render();
</script></body></html>
