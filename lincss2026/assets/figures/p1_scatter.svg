  </text>
  <text x="80" y="54" font-size="12" fill="#6F6A5C">
    34 ancestry groups · Stockholm county · women 1991–2017 (N ≥ 500 per group)
  </text>

  <!-- R² annotation -->
  <g>
    <rect x="540" y="64" width="135" height="28" fill="#EFEAE0" stroke="#C7572B" stroke-width="0.75"/>
    <text x="552" y="83" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#C7572B">R² = 0.79</text>
