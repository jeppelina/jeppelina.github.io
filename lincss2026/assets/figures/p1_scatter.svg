<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'IBM Plex Sans', system-ui, sans-serif">
  <!-- background -->
  <rect width="720" height="460" fill="#EFEAE0"/>

  <!-- plot frame: x 80→680, y 60→380 -->
  <rect x="80" y="60" width="600" height="320" fill="none" stroke="#1B1B1B" stroke-width="0.5"/>

  <!-- zero line (y=0) -->
  <line x1="80" y1="323.5" x2="680" y2="323.5" stroke="#6F6A5C" stroke-width="0.5" stroke-dasharray="2 3"/>

  <!-- regression line: slope 1.24, intercept -0.22 -->
  <line x1="80" y1="359.7" x2="680" y2="102.9" stroke="#C7572B" stroke-width="1.5"/>

  <!-- y-axis ticks at -0.0, 0.2, 0.4, 0.6 -->
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6F6A5C">
    <line x1="76" y1="323.5" x2="80" y2="323.5" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="72" y="328" text-anchor="end">0.0</text>
    <line x1="76" y1="248.2" x2="80" y2="248.2" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="72" y="252" text-anchor="end">0.2</text>
    <line x1="76" y1="172.9" x2="80" y2="172.9" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="72" y="177" text-anchor="end">0.4</text>
    <line x1="76" y1="97.6" x2="80" y2="97.6" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="72" y="101" text-anchor="end">0.6</text>
  </g>

  <!-- y-axis title -->
  <text x="34" y="220" text-anchor="middle" font-size="13" fill="#1B1B1B" transform="rotate(-90, 34, 220)">
    spatial mediation of endogamy
  </text>

  <!-- x-axis ticks at .15, .25, .35, .45, .55 -->
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6F6A5C">
    <line x1="134.5" y1="380" x2="134.5" y2="384" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="134.5" y="398" text-anchor="middle">.15</text>
    <line x1="243.6" y1="380" x2="243.6" y2="384" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="243.6" y="398" text-anchor="middle">.25</text>
    <line x1="352.7" y1="380" x2="352.7" y2="384" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="352.7" y="398" text-anchor="middle">.35</text>
    <line x1="461.8" y1="380" x2="461.8" y2="384" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="461.8" y="398" text-anchor="middle">.45</text>
    <line x1="570.9" y1="380" x2="570.9" y2="384" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="570.9" y="398" text-anchor="middle">.55</text>
  </g>

  <!-- x-axis title -->
  <text x="380" y="422" text-anchor="middle" font-size="13" fill="#1B1B1B">
    residential segregation (dissimilarity index)
  </text>

  <!-- title -->
  <text x="80" y="36" font-family="Fraunces, Georgia, serif" font-size="20" fill="#1B1B1B">
