<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'IBM Plex Sans', system-ui, sans-serif">
  <!-- background -->
  <rect width="720" height="400" fill="#EFEAE0"/>

  <!-- title -->
  <text x="80" y="38" font-family="Fraunces, Georgia, serif" font-size="20" fill="#1B1B1B">
    Ethnic endogamy, Swedish-ancestry women
  </text>
  <text x="80" y="56" font-size="13" fill="#6F6A5C">
    share partnering within own ancestry group, 1991 to 2019
  </text>

  <!-- plot frame: x 80→680, y 80→320 -->
  <line x1="80" y1="320" x2="680" y2="320" stroke="#1B1B1B" stroke-width="0.75"/>
  <line x1="80" y1="80" x2="80" y2="320" stroke="#1B1B1B" stroke-width="0.75"/>

  <!-- y-axis ticks at 80, 82, 84, 86, 88 -->
  <!-- y_px = 320 - (val-80)/8*240 -->
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6F6A5C">
    <line x1="76" y1="320" x2="80" y2="320" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="72" y="324" text-anchor="end">80</text>

    <line x1="76" y1="260" x2="80" y2="260" stroke="#1B1B1B" stroke-width="0.5"/>
    <line x1="80" y1="260" x2="680" y2="260" stroke="#1B1B1B" stroke-width="0.25" stroke-dasharray="2 4" opacity="0.4"/>
    <text x="72" y="264" text-anchor="end">82</text>

    <line x1="76" y1="200" x2="80" y2="200" stroke="#1B1B1B" stroke-width="0.5"/>
    <line x1="80" y1="200" x2="680" y2="200" stroke="#1B1B1B" stroke-width="0.25" stroke-dasharray="2 4" opacity="0.4"/>
    <text x="72" y="204" text-anchor="end">84</text>

    <line x1="76" y1="140" x2="80" y2="140" stroke="#1B1B1B" stroke-width="0.5"/>
    <line x1="80" y1="140" x2="680" y2="140" stroke="#1B1B1B" stroke-width="0.25" stroke-dasharray="2 4" opacity="0.4"/>
    <text x="72" y="144" text-anchor="end">86</text>

    <line x1="76" y1="80" x2="80" y2="80" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="72" y="84" text-anchor="end">88</text>
  </g>

  <!-- y-axis title -->
  <text x="34" y="200" text-anchor="middle" font-size="12" fill="#1B1B1B" transform="rotate(-90, 34, 200)">
    endogamy rate (%)
  </text>

  <!-- x-axis ticks at 1995, 2000, 2005, 2010, 2015 -->
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6F6A5C">
    <line x1="165.7" y1="320" x2="165.7" y2="324" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="165.7" y="338" text-anchor="middle">1995</text>
    <line x1="272.9" y1="320" x2="272.9" y2="324" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="272.9" y="338" text-anchor="middle">2000</text>
    <line x1="380.0" y1="320" x2="380.0" y2="324" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="380.0" y="338" text-anchor="middle">2005</text>
    <line x1="487.1" y1="320" x2="487.1" y2="324" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="487.1" y="338" text-anchor="middle">2010</text>
    <line x1="594.3" y1="320" x2="594.3" y2="324" stroke="#1B1B1B" stroke-width="0.5"/>
    <text x="594.3" y="338" text-anchor="middle">2015</text>
  </g>

  <!-- the trend line -->
  <polyline points="80.0,151.9 101.4,161.6 122.9,152.9 144.3,160.5 165.7,162.7 187.1,153.3 208.6,161.6 230.0,159.5 251.4,173.3 272.9,163.2 294.3,167.8 315.7,169.7 337.1,183.9 358.6,184.6 380.0,186.7 401.4,189.8 422.9,199.6 444.3,197.6 465.7,206.6 487.1,204.9 508.6,202.6 530.0,210.4 551.4,209.7 572.9,209.0 594.3,222.3 615.7,235.2 637.1,245.9 658.6,259.4 680.0,272.8" fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- highlight the endpoints -->
  <circle cx="80.0" cy="151.9" r="5" fill="#C7572B" stroke="#1B1B1B" stroke-width="0.75"/>
  <circle cx="680.0" cy="272.8" r="5" fill="#C7572B" stroke="#1B1B1B" stroke-width="0.75"/>

  <!-- endpoint labels -->
  <text x="92" y="148" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#1B1B1B" font-weight="500">85.6%</text>
  <text x="668" y="285" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#1B1B1B" font-weight="500">81.6%</text>

  <!-- annotation: the change -->
  <text x="678" y="305" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6F6A5C">−4.0 pp in 28 years</text>

  <!-- footer -->
  <text x="80" y="386" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6F6A5C" letter-spacing="0.05em">
    SOURCE · LINDMARKER PAPER 3 · SWEDISH REGISTER DATA · DESCRIPTIVE_ENDOGAMY_RATES_BY_SEX.CSV
  </text>
</svg>
